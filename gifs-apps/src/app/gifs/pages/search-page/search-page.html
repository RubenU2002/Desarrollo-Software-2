<div class="pt-4 pb-4">
	<div class="flex items-center gap-2 mb-4">
		<input
			type="text"
			placeholder="Buscar gifs..."
			class="w-full px-3 py-2 rounded-md bg-white/90 text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
			(keyup.enter)="onSearch(queryInput.value)"
			#queryInput
		/>
		<button
			class="px-3 py-2 rounded-md bg-blue-600 text-white hover:bg-blue-700"
			(click)="onSearch(queryInput.value)">
			Buscar
		</button>
	</div>

	<app-gif-list [gifs]="gifsService.searchResults()"></app-gif-list>
</div>
