<p>character-add works!</p>
<div class="col-12 col-sm-6">
  <h3>Agregar personaje: <span class="dragonball-name">{{ name() }}</span></h3>
      <input
        type="text"
        class="form-control"
        placeholder="Nombre"
        [value]="name()"
        (input)="name.set(txtName.value)"
        #txtName
      >
      <input
        type="number"
        class="form-control mt-2"
        placeholder="Poder"
        [value]="power()"
        (input)="power.set(+txtPower.value)"
        #txtPower
      >
      <button (click)="addCharacter()" class="btn btn-primary mt-2">Guardar</button>
    </div>
