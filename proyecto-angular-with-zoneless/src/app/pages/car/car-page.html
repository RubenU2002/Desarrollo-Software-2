<div class="container text-center mt-5">
  <h1 class="car-title">🚗 Carros de Ruben</h1>
  <h2>Marca del auto: <span class="car-brand">{{ brand() }}</span></h2>
  <h2>Año de fabricación: <span class="car-year">{{ year() }}</span></h2>
  <h2>Propietario: <span class="car-owner">{{ capitalizeStudent() }}</span></h2>
  <h2>Propietario (uppercase): <span class="car-owner">{{ student() | uppercase }}</span></h2>
  <p>Descripción: {{ getCarDescription() }}</p>
  <button class="btn btn-primary mx-2" (click)="changeCar()">Cambiar Car</button>
  <button class="btn btn-primary mx-2" (click)="changeYear()">Cambiar Año</button>
  <button class="btn btn-secondary mx-2" (click)="resetForm()">Resetear</button>
</div>
